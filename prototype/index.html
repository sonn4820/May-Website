  // list of [ok, controlOrField, errorKey]; returns the first control to focus, or null
  let first = null;
  list.forEach(([ok, ctl, key]) => {
    const field = ctl.classList && ctl.classList.contains("field") ? ctl : fieldOf(ctl);
    if (ok) clearFieldError(field);
    else { setFieldError(field, key); if (!first) first = $("input, select, textarea", field) || ctl; }
  });
  return first;
}

// ---------- Schedule form ----------
// A real calendar date between 1900 and today (Feb 30 is refused)
function dobIso(m, d, y) {
  m = Number(m); d = Number(d); y = Number(y);
  const x = new Date(y, m - 1, d);
  if (!m || !d || y < 1900 || x.getFullYear() !== y || x.getMonth() !== m - 1 || x.getDate() !== d || x > new Date()) return "";
  return y + "-" + pad(m) + "-" + pad(d);
}
// Server error codes per field -> where to show them in the form
const SCH_FIELD = { date: '[data-field="slot"]', time: '[data-field="slot"]', firstName: "#sch-first", lastName: "#sch-last", birthdate: '[data-field="sch-dob"]', phone: "#sch-phone", email: "#sch-email", newPatient: '[data-field="newpt"]' };

async function withBusy(btn, work) {
  const html = btn.innerHTML;
  btn.disabled = true;
  btn.setAttribute("aria-busy", "true");
  btn.innerHTML = '<span class="spinner" aria-hidden="true"></span><span></span>';
  btn.lastChild.textContent = t("sending");
  try { return await work(); } finally { btn.disabled = false; btn.removeAttribute("aria-busy"); btn.innerHTML = html; applyI18n(btn); }
}

function onSchSubmit(e) {
  e.preventDefault();
  const f = e.target;
  const first = $("#sch-first").value.trim(), last = $("#sch-last").value.trim();
  const phone = $("#sch-phone").value.trim(), email = $("#sch-email").value.trim();
  const birthdate = dobIso($("#sch-dob-m").value, $("#sch-dob-d").value, $("#sch-dob-y").value);
  const newpt = ($('input[name="newpt"]:checked', f) || {}).value;
  const slotField = $('[data-field="slot"]');
  const bad = check([
    [!!booker.slot, slotField, "err_slot"],
    [first.length >= 1, $("#sch-first"), "err_first"],
    [last.length >= 1, $("#sch-last"), "err_last"],
    [!!birthdate, $('[data-field="sch-dob"]'), "err_dob"],
    [digits(phone).length >= 10, $("#sch-phone"), "err_phone"],
    [!!newpt, $('[data-field="newpt"]'), "err_choose"],
    [!email || validEmail(email), $("#sch-email"), "err_email"]
  ]);
  const focusSlot = () => ($("#slotsGrid .slot") || $("#calGrid .has-slots") || $("#calNext")).focus();
  if (bad) { if (bad === slotField) focusSlot(); else bad.focus(); return; }
  const payload = {
    date: booker.day, time: booker.slot, firstName: first, lastName: last, birthdate, phone, email,
    newPatient: newpt === "yes", reason: $("#sch-reason").value.trim(), lang: $("#sch-lang").value, website: $("#sch-website").value
  };
  const done = () => {
    state.booked.push(payload.date + " " + payload.time);
    state.lastBooking = { day: payload.date, slot: payload.time, phone };
    $("#schOkBody").textContent = bookedText(state.lastBooking);
    swapCard($("#schCard"), f, $("#schOk"));
  };
  const btn = $('button[type="submit"]', f);
  // Only the booking API can book; without it, say so and point to the phone
  if (bookApi.mode !== "api") { setFieldError(slotField, "err_book_down"); focusSlot(); return; }

  withBusy(btn, async () => {
    let res, body = {};
    try {
      res = await fetch("api/booking", { method: "POST", headers: { "content-type": "application/json", accept: "application/json" }, body: JSON.stringify(payload) });
      body = await res.json().catch(() => ({}));
    } catch (err) { res = { status: 0 }; }
    if (res.status === 201) { done(); loadAvailability(); return; }
    if (res.status === 400 && body.fields) {
      let firstBad = null;
      Object.entries(body.fields).forEach(([k, code]) => {
        const el = $(SCH_FIELD[k] || '[data-field="slot"]');
        const field = el.classList.contains("field") ? el : fieldOf(el);
        setFieldError(field, I18N.en[code] ? code : "err_book_down");
        if (!firstBad) firstBad = field;
      });
      if (firstBad === slotField) focusSlot(); else if (firstBad) ($("input, select, textarea", firstBad) || firstBad).focus();
      return;
    }
    // Taken by someone else a moment ago, or OpenDental unreachable: say so above the calendar
    setFieldError(slotField, res.status === 409 ? "err_slot_taken" : "err_book_down");
    if (res.status === 409) { booker.slot = null; await loadAvailability(); }
    focusSlot();
  });
}
const bookedText = (b) => t("sch_ok_body", { when: whenText(b.day, b.slot), phone: b.phone });
// Swap form <-> thank-you message inside a card: the card height glides, then we bring it into view
function swapCard(card, hide, show) {
  animateHeight(card, () => { hide.hidden = true; show.hidden = false; });
  show.focus({ preventScroll: true });
  if (card.getBoundingClientRect().top < 0) animateScrollTo(sectionTop(card));
}
function resetSch() {
  const f = $("#schForm");
  f.reset();
  $$(".field", f).forEach(clearFieldError);
  delete $("#sch-lang").dataset.touched;
  $("#sch-lang").value = state.lang;
  booker.day = booker.slot = booker.month = null;
  renderBooker();
  swapCard($("#schCard"), $("#schOk"), f);
  const first = $("#calGrid .cal__day[aria-pressed=true]") || $("#calGrid .has-slots");
  if (first) first.focus({ preventScroll: true });
}

// ---------- Accessibility menu (round button bottom-left) ----------
// Our own version of the UserWay widget on the clinic's current site: no third-party script,
// same look and 3 languages as the site, and every choice is saved on the person's device.
// Tiles with levels cycle Off → level 1 → level 2 → Off on each press. "Bigger text" drives the
// same text size as the A / A+ / A++ buttons, so both always agree.
const A11Y_TOOLS = [
  { key: "contrast", icon: "contrast", levels: ["a11y_contrast_1", "a11y_contrast_2"] },
  { key: "links", icon: "link" },
  { key: "size", icon: "textsize", levels: ["a11y_size_1", "a11y_size_2"] },
  { key: "spacing", icon: "spacing", levels: ["a11y_level_1", "a11y_level_2"] },
  { key: "still", icon: "pause" },
  { key: "img", icon: "noimg" },
  { key: "font", icon: "font" },
  { key: "cursor", icon: "cursor" },
  { key: "lh", icon: "lineheight", levels: ["a11y_level_1", "a11y_level_2"] },
  { key: "sat", icon: "drop", levels: ["a11y_sat_1", "a11y_sat_2"] }
];
const SCALES = [1, 1.15, 1.3];
const a11yTool = (key) => A11Y_TOOLS.find((f) => f.key === key);
const a11yMax = (f) => (f.levels ? f.levels.length : 1);
const a11yIsOpen = () => $("#a11yPanel").classList.contains("is-open");

function loadA11y() {
  const saved = store.get("a11y", {});
  const out = {};
  A11Y_TOOLS.forEach((f) => {
    if (f.key === "size") return;
    const v = saved && typeof saved === "object" ? Number(saved[f.key]) : 0;
    out[f.key] = Number.isInteger(v) && v > 0 && v <= a11yMax(f) ? v : 0;
  });
  return out;
}
const a11yLevel = (key) => (key === "size" ? Math.max(0, SCALES.indexOf(state.scale)) : state.a11y[key] || 0);

function buildA11y() {
  $("#a11yGrid").innerHTML = A11Y_TOOLS.map((f) =>
    '<button type="button" class="a11y-tile" data-a11y="' + f.key + '" aria-pressed="false">' +
      '<span class="a11y-tile__check" aria-hidden="true"><svg class="ic"><use href="#i-check"/></svg></span>' +
      '<svg class="ic a11y-tile__ic" aria-hidden="true"><use href="#i-' + f.icon + '"/></svg>' +
      '<span class="a11y-tile__name" data-i18n="a11y_' + f.key + '"></span>' +
      '<span class="a11y-tile__state"></span>' +
      (f.levels ? '<span class="a11y-tile__steps" aria-hidden="true">' + f.levels.map(() => "<i></i>").join("") + "</span>" : "") +
    "</button>"
  ).join("");
}

function applyA11y() {
  const site = $("#site");
  A11Y_TOOLS.forEach((f) => {
    if (f.key === "size") return;
    const v = state.a11y[f.key];
    if (v) site.setAttribute("data-a11y-" + f.key, String(v));
    else site.removeAttribute("data-a11y-" + f.key);
  });
  renderA11y();
}

// Tile states and the "something is on" dot on the round button
function renderA11y() {
  if (!$("#a11yGrid")) return;
  let any = false;
  $$("#a11yGrid [data-a11y]").forEach((b) => {
    const f = a11yTool(b.dataset.a11y);
    const v = a11yLevel(f.key);
    if (v) any = true;
    b.setAttribute("aria-pressed", String(v > 0));
    b.querySelector(".a11y-tile__state").textContent = v ? (f.levels ? t(f.levels[v - 1]) : t("a11y_on")) : t("a11y_off");
    $$(".a11y-tile__steps i", b).forEach((i, n) => i.classList.toggle("is-on", n < v));
  });
  $("#a11yReset").disabled = !any;
  $("#a11yBtn").classList.toggle("is-active", any);
}

function stepA11y(key) {
  const f = a11yTool(key);
  if (!f) return;
  const next = (a11yLevel(key) + 1) % (a11yMax(f) + 1);
  if (key === "size") { setScale(SCALES[next]); return; }
  state.a11y[key] = next;
  store.set("a11y", state.a11y);
  applyA11y();
}

function resetA11y() {
  A11Y_TOOLS.forEach((f) => { if (f.key !== "size") state.a11y[f.key] = 0; });
  store.set("a11y", state.a11y);
  if (state.scale !== 1) setScale(1);
  applyA11y();
  $("#a11yStatus").textContent = t("a11y_reset_done");
  $("#a11yClose").focus();
}

let a11yReturnFocus = null;
function openA11y() {
  closeMenu();
  const p = $("#a11yPanel");
  a11yReturnFocus = document.activeElement;
  p.inert = false;
  p.classList.add("is-open");
  $("#a11yBtn").setAttribute("aria-expanded", "true");
  $("#a11yStatus").textContent = "";
  setTimeout(() => $("#a11yClose").focus(), 60);
}
function closeA11y(returnFocus = true) {
  const p = $("#a11yPanel");
  if (!p || !p.classList.contains("is-open")) return;
  p.classList.remove("is-open");
  p.inert = true;
  $("#a11yBtn").setAttribute("aria-expanded", "false");
  if (!returnFocus) return;
  const back = a11yReturnFocus && document.contains(a11yReturnFocus) && a11yReturnFocus.offsetParent ? a11yReturnFocus : $("#a11yBtn");
  back.focus({ preventScroll: true });
}
// Tab stays inside the panel while it is open
function trapA11yFocus(e) {
  if (e.key !== "Tab" || !a11yIsOpen()) return;
  const f = $$("button:not(:disabled)", $("#a11yPanel")).filter((x) => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (!$("#a11yPanel").contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

// ---------- Events ----------
function onClick(e) {
  if (a11yIsOpen() && !e.target.closest("#a11yPanel, #a11yBtn")) closeA11y(false);
  if (e.target.closest(".mmenu__backdrop")) return closeMenu();
  const dd = $("#servicesMenu");
  if (dd.classList.contains("is-open") && !e.target.closest(".nav__item")) toggleDropdown(false);
  const el = e.target.closest("button, a");
  if (!el) return;
  const d = el.dataset;
  if (d.maps !== undefined || d.call !== undefined) return; // Let the browser open real links.
  if (el.tagName === "A") e.preventDefault();
  if (d.lang) return setLang(d.lang);
  if (d.scale) return setScale(Number(d.scale));
  if (d.a11y) return stepA11y(d.a11y);
  if (d.date && el.classList.contains("cal__day")) return pickDay(d.date);
  if (d.slot && el.classList.contains("slot")) return pickSlot(d.slot);
  if (d.closeMenu !== undefined) return closeMenu();
  if (d.skip !== undefined) return $("#main").focus();
  if (d.route) return goPage(d.route, d.scroll, d.doc);
  if (el.classList.contains("faq__q")) {
    const open = el.getAttribute("aria-expanded") !== "true";
    el.setAttribute("aria-expanded", String(open));
    return setCollapse($("#" + el.getAttribute("aria-controls")), open);
  }
  switch (el.id) {
    case "menuBtn": return $("#mobileMenu").classList.contains("is-open") ? closeMenu() : openMenu();
    case "a11yBtn": return a11yIsOpen() ? closeA11y() : openA11y();
    case "a11yClose": return closeA11y();
    case "a11yReset": return resetA11y();
    case "servicesToggle": return toggleDropdown();
    case "noticeClose": return closeNotice();
    case "schAgain": return resetSch();
    case "calPrev": return stepMonth(-1);
    case "calNext": return stepMonth(1);
  }
}

function onInput(e) {
  const el = e.target;
  if (el.id === "sch-lang") el.dataset.touched = "1";
  if (el.closest && el.closest(".field.has-error") && e.type === "change") {
    // Re-check gently once the person fixes a field
    const f = el.closest(".field");
    if ((el.type === "radio" || el.type === "checkbox") && el.checked) clearFieldError(f);
  }
}

function onKey(e) {
  if (e.key === "Escape") {
    if (a11yIsOpen()) { closeA11y(); return; }
    if ($("#mobileMenu").classList.contains("is-open")) { closeMenu(); return; }
    if ($("#servicesMenu").classList.contains("is-open")) { toggleDropdown(false); $("#servicesToggle").focus(); }
  }
  trapMenuFocus(e);
  trapA11yFocus(e);
}

// ---------- Start ----------
function init() {
  state.a11y = loadA11y();
  buildA11y();
  applyA11y();
  setScale(state.scale);
  $("#site").lang = state.lang;
  document.documentElement.lang = state.lang;
  $$("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  applyI18n();
  renderSite();
  loadAvailability();
  setupReveal();
  updateBreakpoint();

  document.addEventListener("click", onClick);
  document.addEventListener("input", onInput);
  document.addEventListener("change", onInput);
  document.addEventListener("keydown", onKey);
  $("#schForm").addEventListener("submit", onSchSubmit);
  // Back/Forward between pages
  window.addEventListener("popstate", () => routeFromHash(true));
  window.addEventListener("scroll", onSiteScroll, { passive: true });
  window.addEventListener("resize", () => { updateBreakpoint(); onSiteScroll(); });
  if ("ResizeObserver" in window) new ResizeObserver(() => { updateBreakpoint(); onSiteScroll(); }).observe($("#site"));
  ["wheel", "touchstart", "keydown"].forEach((ev) => window.addEventListener(ev, cancelScroll, { passive: true }));
  $$(".collapse").forEach((c) => c.setAttribute("aria-hidden", String(!c.classList.contains("is-open"))));
  setInterval(renderStatus, 60000);
  onSiteScroll();
  openFromHash();
  booted = true;
}

// Links can open a language or a page directly, e.g. #vi, #schedule, #services/dentures
function openFromHash() {
  const h = location.hash.slice(1);
  const actions = {
    vi: () => setLang("vi"), es: () => setLang("es"), en: () => setLang("en"),
    schedule: () => goPage("schedule"), "new-patients": () => goPage("new")
  };
  if (actions[h]) actions[h]();
  else routeFromHash(false);
}
init();

</script>
